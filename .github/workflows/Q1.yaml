name: Q1 - Archive XYZ
on:
  push:
    paths:
      - 'XYZ.txt'
      - 'README.md'
      - '.github/workflows/Q1.yaml'
jobs:
  archive-q1:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Copier XYZ.txt
        run: cp XYZ.txt Q1_archive_XYZ.txt
      - name: Pousser le fichier vers le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
